# Ecossistema completo de pagamentos PIX — sobe infraestrutura + os 2 serviços de uma vez.
#
#   docker compose up --build
#
# Serviços (portas no host):
#   - payment-core (SAGA, Java)        http://localhost:8080   (Swagger: /swagger-ui.html)
#   - ms-comprovantes (Python/FastAPI) http://localhost:8081   (Docs: /docs)
#   - RabbitMQ management              http://localhost:15672  (guest/guest)
#   - PostgreSQL                       localhost:5432
#
# O payment-core fala com o comprovantes REAL (Python) via rede interna:
# COMPROVANTES_BASE_URL=http://comprovantes:8080.

services:
  # ----------------------------------------------------------------- infraestrutura
  postgres:
    image: postgres:16-alpine
    container_name: pix-postgres
    environment:
      POSTGRES_USER: comprovantes_user
      POSTGRES_PASSWORD: comprovantes_pass
      POSTGRES_DB: comprovantesdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comprovantes_user -d comprovantesdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [pix-net]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: pix-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # UI
    healthcheck:
      # check_port_connectivity garante que o listener AMQP (5672) aceita conexões — o
      # 'ping' fica healthy antes disso e causava corrida no startup do comprovantes.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [pix-net]

  redis:
    image: redis:7-alpine
    container_name: pix-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [pix-net]

  # ----------------------------------------------------------------- serviços
  # Comprovantes (Python/FastAPI) — submodule ms-comprovantes @ develop.
  # O entrypoint aguarda o Postgres, roda as migrations (alembic) e sobe o uvicorn.
  comprovantes:
    build:
      context: ./services/comprovantes
      dockerfile: Dockerfile
    container_name: pix-comprovantes
    restart: on-failure     # rede de segurança contra corrida de infra no boot
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://comprovantes_user:comprovantes_pass@postgres:5432/comprovantesdb
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: 300
      LOG_LEVEL: INFO
    ports:
      - "8081:8080"
    networks: [pix-net]

  # Core & SAGA (Java) — submodule payment-core. Aponta para o comprovantes real.
  payment-core:
    build:
      context: ./services/payment-core
      dockerfile: Dockerfile
    container_name: pix-payment-core
    restart: on-failure     # rede de segurança contra corrida de infra no boot
    depends_on:
      comprovantes:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      COMPROVANTES_BASE_URL: http://comprovantes:8080
    networks: [pix-net]

volumes:
  postgres_data:

networks:
  pix-net:
    driver: bridge
